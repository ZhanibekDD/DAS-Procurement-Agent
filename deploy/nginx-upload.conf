# Include inside the DAS Снабжение server only. One file: 100 MiB in API;
# +1 MiB for bounded multipart framing, never 101 MiB of file allowance.
client_max_body_size 101m;
client_body_timeout 60s;
error_page 413 = @procurement_upload_too_large;
location @procurement_upload_too_large {
    default_type application/json;
    return 413 '{"detail":"Файл больше 100 МБ"}';
}
# In the existing proxy location, keep existing auth/header/TLS settings:
# proxy_request_buffering off;
# proxy_http_version 1.1;
