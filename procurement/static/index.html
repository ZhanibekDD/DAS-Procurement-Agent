async function modalAction(fn,success){const btn=$('#modalSubmit');btn.disabled=true;btn.classList.add('loading');try{await fn();$('#modal').close();toast(success);await loadAll();showView(state.view)}catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.classList.remove('loading')}}

async function previewSupplierImport(){const file=$('#supplierFile').files[0];if(!file)return toast('Выберите файл',true);const fd=new FormData();fd.append('file',file);try{const result=await api('/api/suppliers/import?commit=false',{method:'POST',body:fd});$('#importPreview').innerHTML=`<div class="guard">Распознано строк: <b>${result.valid_rows}</b>, ошибок: <b>${result.errors.length}</b></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Название</th><th>Регион</th><th>Email</th></tr></thead><tbody>${result.rows.slice(0,15).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.region)}</td><td>${esc(r.email)}</td></tr>`).join('')}</tbody></table></div>`;$('#modalSubmit').textContent='Импортировать';$('#modalSubmit').onclick=()=>commitSupplierImport(file)}catch(e){toast(e.message,true)}}
const commitSupplierImport=file=>modalAction(()=>{const fd=new FormData();fd.append('file',file);return api('/api/suppliers/import?commit=true',{method:'POST',body:fd})},'Поставщики импортированы');const uploadDocument=()=>modalAction(()=>{const file=$('#dFile').files[0];if(!file)throw new Error('Выберите файл');const fd=new FormData();fd.append('file',file);const project=$('#dProject').value;return api(`/api/documents?document_type=${encodeURIComponent($('#dType').value)}${project?'&project_id='+project:''}`,{method:'POST',body:fd})},'Документ принят в очередь разбора');const createPriceHistory=()=>modalAction(()=>api('/api/price-history',{method:'POST',body:JSON.stringify({supplier_id:$('#hSupplier').value?Number($('#hSupplier').value):null,item_name:$('#hItem').value,quantity:$('#hQuantity').value,unit:$('#hUnit').value,unit_price:$('#hPrice').value,currency:$('#hCurrency').value,vat_included:true,purchased_on:$('#hDate').value,invoice_number:$('#hInvoice').value,project_name:$('#hProject').value,region:$('#hRegion').value,confirmed_by:$('#hConfirmed').value})}),'Историческая цена подтверждена');const createQuote=()=>modalAction(()=>api(`/api/lots/${state.selectedLot}/quotes`,{method:'POST',body:JSON.stringify({supplier_id:Number($('#qSupplier').value),currency:'RUB',vat_included:true,delivery_cost:$('#qDelivery').value||0,lead_days:Number($('#qDays').value||0),payment_terms:$('#qTerms').value,items:[...document.querySelectorAll('[data-quote-item]')].map(x=>({lot_item_id:Number(x.dataset.quoteItem),unit_price:x.value,compliant:true}))})}),'Коммерческое предложение добавлено').then(loadComparison);async function openLot(id){state.selectedLot=id;state.tenderLot=state.lots.find(l=>Number(l.id)===Number(id))||null;state.tenderMatches=[];state.tenderComparison=null;state.tenderLoading=true;showView('tender');try{const lot=await api(`/api/lots/${id}`),[matchesResult,comparisonResult]=await Promise.allSettled([api(`/api/lots/${id}/supplier-matches`),api(`/api/lots/${id}/comparison`)]);state.tenderLot={...state.tenderLot,...lot};state.tenderMatches=matchesResult.status==='fulfilled'?matchesResult.value:[];state.tenderComparison=comparisonResult.status==='fulfilled'?comparisonResult.value:null;state.comparison=state.tenderComparison;renderTender()}catch(e){toast(e.message,true)}finally{state.tenderLoading=false}}
$('#demoBtn').onclick=loadDemo;$('#refreshBtn').onclick=()=>state.demo?loadDemo():loadAll();$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)showView(b.dataset.view)};bindOpeners();loadAll();

function renderArchive(){
  const batches=state.importBatches||[];
  const drafts=state.supplierDrafts||[];
  const entries=state.priceEntries||[];
  const statusLabel={pending:'В очереди',processing:'Обрабатывается',needs_review:'На проверке',done:'Готово',failed:'Ошибка'};
  const docTypeLabel={price_list:'Прайс-лист',invoice:'Счёт',commercial_offer:'КП',unknown:'Неизвестно'};
  $('#archive').innerHTML=`
  <section class="panel" style="margin-bottom:18px">
    <div class="panel-title">
      <div><h2>Пакетный импорт КП и счетов</h2>
        <p>До 20 файлов PDF или XLSX за раз. Извлекаются поставщик, позиции, цены, трассировка до строки.</p></div>
      <button class="btn" onclick="openBatchImport()">${icon('upload')}Загрузить пакет</button>
    </div>
    ${batches.length?`<div class="table-wrap"><table><thead><tr>
      <th>ID</th><th>Файлов</th><th>Статус</th><th>Черновики</th><th>Позиции</th><th>Создан</th>
    </tr></thead><tbody>
    ${batches.map(b=>`<tr>
      <td><button class="btn secondary small" onclick="openBatch(${b.id})">#${b.id}</button></td>
      <td>${(b.filenames||[]).length}</td>
      <td>${badge(b.status)}</td>
      <td>${(b.supplier_drafts||[]).length}</td>
      <td>${(b.price_history_entries||[]).length}</td>
      <td>${date(b.created_at)}</td>
    </tr>`).join('')}
    </tbody></table></div>`
    :empty('Пакеты не созданы','Загрузите КП или прайс-листы для разбора')}
  </section>
  <section class="panel" style="margin-bottom:18px">
    <div class="panel-title">
      <div><h2>Черновики поставщиков</h2>
        <p>Поставщики, извлечённые из документов. Подтвердите или отклоните перед добавлением в базу.</p></div>
    </div>
    ${drafts.length?`<div class="table-wrap"><table><thead><tr>
      <th>Наименование</th><th>ИНН</th><th>Регион</th><th>Кластер</th><th>Статус</th><th>Действия</th>
    </tr></thead><tbody>
    ${drafts.map(d=>{const draftRegion=d.suggested_region||d.region||'',draftCluster=d.suggested_cluster||d.cluster||'';return `<tr data-draft-id="${d.id}">
      <td><b>${esc(d.name)}</b><br><small class="muted">${esc(d.email)}</small>${d.matched_supplier_id?`<br><span class="badge green">Найден в базе: ${esc(d.matched_supplier_name)}</span>`:''}</td>
      <td>${esc(d.tax_id)||'—'}</td>
      <td><input class="draft-field draft-region" value="${esc(draftRegion)}" placeholder="Укажите регион" oninput="updateDraftConfirmState(${d.id})"></td>
      <td><select class="draft-field draft-cluster" onchange="updateDraftConfirmState(${d.id})">
        <option value="">Выберите кластер</option>
        <option value="cluster_1" ${draftCluster==='cluster_1'?'selected':''}>Кластер 1 · Урал Сибирь Север</option>
        <option value="cluster_2" ${draftCluster==='cluster_2'?'selected':''}>Кластер 2 · Центр Юг</option>
      </select></td>
      <td>${badge(d.status)}</td>
      <td>
        ${d.status==='needs_review'?`
        <button class="btn small draft-confirm" onclick="confirmDraft(${d.id})" ${draftRegion&&draftCluster?'':'disabled'}>${icon('check')}Подтвердить</button>
        <button class="btn secondary small" onclick="rejectDraft(${d.id})">Отклонить</button>
        `:''}
      </td>
    </tr>`}).join('')}
    </tbody></table></div>`
    :empty('Черновики поставщиков отсутствуют','Загрузите КП или прайс-листы для автоматического извлечения')}
  </section>
  <section class="panel">
    <div class="panel-title">
      <div><h2>Позиции истории цен</h2>
        <p>Извлечённые позиции с трассировкой до документа, страницы и строки.</p></div>
    </div>
    ${entries.length?`<div class="table-wrap"><table><thead><tr>
      <th>Позиция</th><th>Ед.</th><th>Цена</th><th>Вал.</th><th>НДС</th><th>Документ</th><th>Статус</th>
    </tr></thead><tbody>
    ${entries.map(e=>`<tr>
      <td><b>${esc(e.item_name)}</b>${e.is_expired?'<span class="badge" style="background:#dc2626;margin-left:4px">истёк</span>':''}</td>
      <td>${esc(e.unit)}</td>
      <td style="font-variant-numeric:tabular-nums">${esc(e.unit_price)}</td>
      <td>${esc(e.currency)}</td>
      <td>${e.vat_included?'с НДС':'без НДС'}</td>
      <td><small>${esc(e.source_sheet||'')}${e.source_page?' стр.'+e.source_page:''}${e.source_row?' стр.'+e.source_row:''}</small></td>
      <td>${badge(e.status)}</td>
    </tr>`).join('')}
    </tbody></table></div>`
    :empty('Позиции отсутствуют','Подтвердите пакет импорта для появления позиций в истории цен')}
  </section>`;
}

function openBatchImport(){
  $('#modalTitle').textContent='Пакетный импорт КП / счетов';
  $('#modalBody').innerHTML=`
    <p style="margin-bottom:12px">Выберите от 1 до 20 файлов PDF или XLSX (КП, прайс-листы, счета). Максимум 25 МБ на файл.</p>
    <label class="field-label">Файлы</label>
    <input type="file" id="batchFiles" multiple accept=".pdf,.xlsx,.xls" style="margin-bottom:12px">
    <label class="field-label">Создал</label>
    <input type="text" id="batchCreatedBy" value="Сотрудник снабжения" style="margin-bottom:4px">
  `;
  $('#modalSubmit').onclick=submitBatchImport;
  $('#modal').showModal();
}

async function submitBatchImport(){
  const files=$('#batchFiles').files;
  if(!files||!files.length){toast('Выберите хотя бы один файл',true);return;}
  if(files.length>20){toast('Максимум 20 файлов',true);return;}
  const createdBy=$('#batchCreatedBy').value||'system';
  const fd=new FormData();
  for(const f of files) fd.append('files',f);
  try{
    const result=await api(`/api/imports/batch?created_by=${encodeURIComponent(createdBy)}`,{method:'POST',body:fd});
    toast(`Пакет #${result.id} создан: ${(result.price_history_entries||[]).length} позиций`);
    $('#modal').close();
    await loadArchive();
    renderArchive();
  }catch(e){toast(e.message,true)}
}

async function openBatch(id){
  try{
    const b=await api(`/api/imports/${id}`);
    const entries=b.price_history_entries||[];
    const draftEntries=entries.filter(e=>e.status==='draft');
    $('#modalTitle').textContent=`Пакет #${id} — проверка позиций`;
    $('#modalBody').innerHTML=`
      <p>${b.filenames.join(', ')}</p>
      <p>Позиций на проверке: <b>${draftEntries.length}</b> из <b>${entries.length}</b></p>
      <label class="field-label">Подтверждает</label>
      <input type="text" id="batchConfirmBy" value="Сотрудник снабжения" style="margin-bottom:12px">
      ${draftEntries.length?`<p>Нажмите «Подтвердить выбранное» чтобы принять все позиции в историю цен.</p>`:'<p>Все позиции уже обработаны.</p>'}
    `;
    $('#modalSubmit').textContent='Подтвердить все позиции';
    $('#modalSubmit').onclick=async()=>{
      if(!draftEntries.length){$('#modal').close();return;}
      const confirmedBy=$('#batchConfirmBy').value||'system';
      try{
        await api(`/api/imports/${id}/confirm`,{method:'POST',body:JSON.stringify({confirmed_by:confirmedBy,entry_ids:draftEntries.map(e=>e.id)})});
        toast('Позиции подтверждены');
        $('#modal').close();
        await loadArchive();
        renderArchive();
      }catch(e){toast(e.message,true)}
    };
    $('#modal').showModal();
  }catch(e){toast(e.message,true)}
}

function updateDraftConfirmState(id){
  const row=document.querySelector(`tr[data-draft-id="${id}"]`);
  if(!row)return;
  row.querySelector('.draft-confirm').disabled=!(row.querySelector('.draft-region').value.trim()&&row.querySelector('.draft-cluster').value);
}

async function confirmDraft(id){
  const row=document.querySelector(`tr[data-draft-id="${id}"]`);
  if(!row)return toast('Черновик не найден',true);
  const region=row.querySelector('.draft-region').value.trim();
  const cluster=row.querySelector('.draft-cluster').value;
  if(!region||!cluster)return toast('Сначала укажите регион и кластер',true);
  try{
    await api(`/api/supplier-drafts/${id}/confirm`,{method:'POST',body:JSON.stringify({confirmed_by:'Сотрудник снабжения',cluster,region})});
    toast('Поставщик добавлен в базу');
    await loadArchive();
    renderArchive();
  }catch(e){toast(e.message,true)}
}

async function rejectDraft(id){
  const notes=prompt('Причина отклонения:');
  try{
    await api(`/api/supplier-drafts/${id}/reject`,{method:'POST',body:JSON.stringify({rejected_by:'Сотрудник снабжения',review_notes:notes||''})});
    toast('Черновик отклонён');
    await loadArchive();
    renderArchive();
  }catch(e){toast(e.message,true)}
}

async function loadArchive(){
  const [batches,drafts,entries]=await Promise.allSettled([
    api('/api/imports'),
    api('/api/supplier-drafts?status=needs_review'),
    api('/api/price-history-entries?status=draft&limit=100'),
  ]);
  state.importBatches=batches.status==='fulfilled'?batches.value:[];
  state.supplierDrafts=drafts.status==='fulfilled'?drafts.value:[];
  state.priceEntries=entries.status==='fulfilled'?entries.value:[];
}

</script>
