<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход — DAS Снабжение</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5fa;color:#162033;padding:24px}
    .shell{width:min(100%,420px)}
    .brand{display:flex;align-items:center;gap:12px;margin:0 0 22px}
    .mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#2457d6;color:#fff;font-weight:800;letter-spacing:.04em;box-shadow:0 10px 28px rgba(36,87,214,.24)}
    .brand strong{display:block;font-size:17px}
    .brand span{display:block;margin-top:2px;color:#6c778a;font-size:13px}
    .card{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(31,47,78,.12)}
    h1{margin:0 0 8px;font-size:27px;line-height:1.2}
    .lead{margin:0 0 26px;color:#667188;font-size:14px;line-height:1.55}
    label{display:block;margin:0 0 7px;font-size:13px;font-weight:700;color:#334057}
    input{width:100%;height:46px;border:1px solid #cfd7e4;border-radius:11px;padding:0 13px;font:inherit;color:#162033;background:#fff;outline:none;transition:.18s}
    input:focus{border-color:#2457d6;box-shadow:0 0 0 3px rgba(36,87,214,.13)}
    .field{margin-bottom:17px}
    button{width:100%;height:47px;border:0;border-radius:11px;background:#2457d6;color:#fff;font:inherit;font-weight:750;cursor:pointer;margin-top:5px}
    button:hover{background:#1d49b8}
    .error{margin:0 0 18px;padding:11px 13px;border-radius:10px;background:#fff0f0;border:1px solid #f4c2c2;color:#a32b2b;font-size:13px;line-height:1.4}
    .note{margin:20px 0 0;text-align:center;color:#7a8495;font-size:12px;line-height:1.5}
    @media(max-width:480px){body{padding:16px}.card{padding:25px 21px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="mark" aria-hidden="true">DAS</div>
      <div><strong>DAS Снабжение</strong><span>Независимый рабочий кабинет</span></div>
    </div>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Вход в систему</h1>
      <p class="lead">Используйте учётную запись службы снабжения. Доступ к кабинету и API защищён серверной сессией.</p>
      {{ERROR_MESSAGE}}
      <form method="post" action="/auth/login">
        <div class="field">
          <label for="username">Логин</label>
          <input id="username" name="username" type="text" autocomplete="username" maxlength="128" required autofocus>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        </div>
        <button type="submit">Войти</button>
      </form>
      <p class="note">Пароль не сохраняется в браузере и не передаётся в DAS.</p>
    </section>
  </main>
</body>
</html>
