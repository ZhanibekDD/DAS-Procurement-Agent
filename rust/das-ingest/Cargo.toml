[package]
name = "das-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fail-closed spreadsheet normalizer for DAS Procurement"
license = "Proprietary"
publish = false

[dependencies]
calamine = "=0.36.1"
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
