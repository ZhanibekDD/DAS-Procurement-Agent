name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check launch JavaScript
        run: node --check procurement/static/launch.js && node tests/ui_launch_guards.cjs && node tests/ui_review_helpers.cjs && node tests/ui_refresh_guard.cjs && node tests/ui_upload_limit.cjs
      - name: Compile Python sources
        run: python -m compileall -q procurement tests

