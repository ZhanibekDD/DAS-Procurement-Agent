name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Install native Russian OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check launch JavaScript
        run: node --check procurement/static/launch.js && node --check procurement/static/procurement.js && node tests/ui_launch_guards.cjs && node tests/ui_review_helpers.cjs && node tests/ui_refresh_guard.cjs && node tests/ui_upload_limit.cjs && node tests/ui_supplier_ocr.cjs && node tests/ui_procurement_flow.cjs
      - name: Compile Python sources
        run: python -m compileall -q procurement tests
      - name: Check independent price memory
        run: node --check procurement/static/price-memory.js && node tests/ui_price_memory.cjs

